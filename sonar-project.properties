# SonarQube Configuration for Flavour Bites (React + Express Monorepo)
# 
# This project has:
# - Frontend: React 19 + TypeScript (src/client)
# - Backend: Express 4 + TypeScript (src/server)
# - Shared: Types, API, constants (src/shared)
# - Tests: Vitest with v8 coverage (test/**)
# - Coverage: v8 provider, lcov output

sonar.projectKey=flavour-bites
sonar.projectName=Flavour Bites
sonar.projectVersion=0.0.0

# ──────────────────────────────────────────────
# SOURCE & TEST FILES
# ──────────────────────────────────────────────
# Frontend (React) + Backend (Express) + Shared
sonar.sources=src
sonar.tests=test

# ──────────────────────────────────────────────
# EXCLUSIONS (never analyze these)
# ──────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.next/**,\
  **/coverage/**,\
  **/graphify-out/**,\
  **/agent/**,\
  **/*.d.ts,\
  **/vite.config.ts,\
  **/vitest.config.ts,\
  **/esbuild.*,\
  **/docker*.*,\
  **/*.md,\
  **/public/**,\
  prisma/**,\
  .*.yml,\
  .*.yaml,\
  .env*,\
  sonar-project.properties

# ──────────────────────────────────────────────
# TEST & COVERAGE
# ──────────────────────────────────────────────
# Vitest test file patterns (matches vitest.config.ts include)
sonar.test.inclusions=\
  test/**/*.test.ts,\
  test/**/*.test.tsx,\
  test/**/*.spec.ts,\
  test/**/*.spec.tsx

# Coverage report paths (v8 provider generates lcov.info)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ──────────────────────────────────────────────
# LANGUAGE SETTINGS
# ──────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# ──────────────────────────────────────────────
# QUALITY GATES (optional - configure in SonarQube UI)
# ──────────────────────────────────────────────
# sonar.qualitygate.wait=true