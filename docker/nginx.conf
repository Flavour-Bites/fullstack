# Static host for the built client bundle (dist/client). Mirrors the headers
# and SPA rewrite configured for Vercel in vercel.json, with the API origin
# swapped for the local stack (http://localhost:3000).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — mirrors vercel.json rewrites (/(.*) -> /index.html).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so they are safe to cache forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://telegram.org https://oauth.telegram.org; img-src 'self' data: blob: https://res.cloudinary.com https://images.unsplash.com; connect-src 'self' http://localhost:3000 https://oauth.telegram.org https://api.cloudinary.com; frame-src 'self' https://telegram.org https://oauth.telegram.org" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
