# Local production mimic.
#
# Reproduces the deployed topology on one machine:
#   frontend (nginx, like Vercel)  →  backend (Express, like Render)  →  Postgres
#                                                                   →  Redis (optional)
#
# Service-specific connectivity (DB/Redis/URLs) is overridden here; secrets are
# read from the repo `.env` (the same file used for local development), so the
# real Neon database is never used by this stack.
#
#   docker compose up --build
#   docker compose --profile tools run --rm seed   # after the backend is up
#
# frontend: http://localhost:8080   backend: http://localhost:3000
name: flavour-bites

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flavour
      POSTGRES_PASSWORD: flavour
      POSTGRES_DB: flavour_bites
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flavour -d flavour_bites"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the schema on a fresh database with `prisma db push` — the same
  # bootstrap documented for local setup. The migration history has no baseline
  # (the initial migration only ALTERs legacy tables), so `migrate deploy` alone
  # cannot initialize an empty database. Once the tables exist, the production
  # entrypoint baselines the tracked migrations (P3005) just like on Render.
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://flavour:flavour@db:5432/flavour_bites
    command: ["npx", "prisma", "db", "push", "--skip-generate"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # The production image runs the production code path, but pointed at
      # local loopback services (hence ALLOW_LOOPBACK_APP_URL).
      APP_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:8080
      DATABASE_URL: postgresql://flavour:flavour@db:5432/flavour_bites
      REDIS_URL: redis://redis:6379
      ALLOW_LOOPBACK_APP_URL: "true"
      # Secrets come from the repo .env used for local development.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CSRF_SECRET: ${CSRF_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set TELEGRAM_WEBHOOK_SECRET in .env}
      TELEGRAM_OPENID_CONNECT_CLIENT_ID: ${TELEGRAM_OPENID_CONNECT_CLIENT_ID:?set TELEGRAM_OPENID_CONNECT_CLIENT_ID in .env}
      TELEGRAM_OPENID_CONNECT_CLIENT_SECRET: ${TELEGRAM_OPENID_CONNECT_CLIENT_SECRET:?set TELEGRAM_OPENID_CONNECT_CLIENT_SECRET in .env}
      TELEGRAM_STAFF_CHAT_ID: ${TELEGRAM_STAFF_CHAT_ID:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CLOUDINARY_UPLOAD_FOLDER: ${CLOUDINARY_UPLOAD_FOLDER:-flavour-bites}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Baked into the bundle at build time, exactly as on Vercel.
        VITE_API_URL: http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot seeder. Uses the builder stage because the runtime image omits dev
  # dependencies (tsx) and the client build. Not started by `up`.
  seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://flavour:flavour@db:5432/flavour_bites
    command: ["npx", "tsx", "prisma/seed/index.ts"]

volumes:
  db-data:
